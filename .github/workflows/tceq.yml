name: TCEQ Freeport feed

on:
  schedule:
    - cron: '17 * * * *'      # 매시 17분(UTC) — GitHub 사정으로 수~수십 분 늦어질 수 있음
  workflow_dispatch:          # Actions 화면에서 수동 실행 버튼

permissions:
  contents: write             # tceq.json 커밋용

concurrency:
  group: tceq-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect TCEQ
        run: node tceq_collector.js
      - name: Commit tceq.json
        run: |
          git config user.name "freeport-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tceq.json index.html .nojekyll
          git commit -m "TCEQ feed $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            sleep 5
          done
